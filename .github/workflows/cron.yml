name: GEM-V210 Auto Sync

on:
  schedule:
    - cron: '*/5 * * * *' # 每 5 分鐘自動執行一次
  workflow_dispatch: # 允許您隨時手動點擊執行測試

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Orchestrator
        run: python main.py
