name: GEM-V210 Auto Sync

on:
  workflow_dispatch:
  schedule:
    # 每 6 小時自動執行一次 (可依需求自行調整或刪除)
    - cron: '0 */6 * * *'

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install folium pydantic requests matplotlib ipython google-genai notion-client nest_asyncio numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run GEM Engine Sync
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          TGOS_API_KEY: ${{ secrets.TGOS_API_KEY }}
          ESTAT_API_KEY: ${{ secrets.ESTAT_API_KEY }}
          KTO_DATA_LAB_KEY: ${{ secrets.KTO_DATA_LAB_KEY }}
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          python main.py
